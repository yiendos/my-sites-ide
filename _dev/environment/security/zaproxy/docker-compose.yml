services:
    zaproxy:
        container_name: "zaproxy"
        image: ghcr.io/zaproxy/zaproxy:20260826-weekly
        volumes:
            - './reports:/zap/wrk'
            # Persists addon-management state (not scan data - core/action/newSession
            # resets that regardless) across otherwise-stateless --rm container runs.
            # Needed so an addon uninstall (see ide:zap-daemon) actually sticks before
            # a later -daemon run initializes extensions, rather than being redone
            # from the image's bundled plugin dir on every fresh container.
            - 'zap-home:/home/zap'
        mem_limit: ${ZAP_MEM_LIMIT:-5g}
        cpus: '${ZAP_CPUS:-4}'
        cpuset: '${ZAP_CPUSET:-0,1,2,3}'
        env_file:
            - ./.env
            - ./../../../../.env
        ports:
            - '8080:8080'
            - '8090:8090'
        networks:
            - my-sites-ide

    # not started by `ide:spark` (deliberately excluded from APP= in .env)
    # invoked on demand via `php my-sites-ide ide:zap-scan <target>`
    # or `php my-sites-ide ide:zap-hud` for the browser-based Desktop UI
    # ports are only published when zap-hud runs `docker compose run --service-ports`
    # ide:zap-hud - further the pid / service is only ran when you visit the localhost:8080/zap

volumes:
    zap-home:
