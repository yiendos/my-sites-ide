services:
    nginx:
        container_name: "nginx"
        image: ${NAMESPACE}_nginx:latest
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - '443:443'
        environment:
            FPM_HOST: "fpm:9000"
            SERVER_NAME: "localhost"
        volumes:
            - './../../../../Repos:/opt/repos/'
            #- './../../certificates/certbot/conf/archive:/etc/nginx/ssl/archive'
            #- './../../certificates/certbot/conf/live:/etc/nginx/ssl/live'
            - './../ssl:/etc/nginx/ssl'
            - './conf/nginx.conf:/etc/nginx/nginx.conf'
        networks:
            my-sites-ide:
                aliases:
                    - ${ZAP_TARGET_ALIAS:-default.test}