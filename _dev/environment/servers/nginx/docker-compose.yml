services:
    nginx:
        container_name: "nginx"
        image: ${NAMESPACE}_nginx:latest
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - '443:443'
        environment:
            FPM_HOST: "fpm:9000"
            SERVER_NAME: "localhost"
        volumes:
            - './../../../../Repos:/opt/repos/'
            # the IDE's shared certificate store, filled by a certificate plugin (e.g. certbot-cloudflare);
            # empty without one - sites then use the self-signed certificate below
            - './../../../../storage/certificates/archive:/etc/nginx/ssl/archive'
            - './../../../../storage/certificates/live:/etc/nginx/ssl/live'
            - './../ssl:/etc/nginx/ssl'
            - './conf/nginx.conf:/etc/nginx/nginx.conf'
        networks:
            my-sites-ide:
                aliases:
                    - ${IDE_SITE_ALIAS:-default.test}