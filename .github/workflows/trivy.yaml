name: Docker image scan for Pull Requests
on:
  #this will trigger each time you push a commit, useful for debugging
  #push
  pull_request:
    types: [opened, assigned, review_requested]
jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      #docker-compose.yml includes docker-compose.plugins.yml, which plugin discovery
      #generates on composer's post-autoload-dump - no dependencies need installing for it,
      #and with no composer.local.json in CI it's the empty, no-plugins version
      - name: Generate plugins compose file
        run: composer dump-autoload --no-interaction
      - name: Build cron image first
        run: docker compose --progress quiet build cron
        env: 
            NAMESPACE: ${{ secrets.NAMESPACE }}
      - name: Build fpm image
        run: docker compose --progress quiet build fpm
        env: 
            NAMESPACE: ${{ secrets.NAMESPACE }}
      - name: Run trivy over cron 
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: 'my_site_cron'
          format: 'table'
          exit-code: 0
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      - name: Run trivy over fpm 
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: 'my_site_fpm'
          format: 'table'
          exit-code: 0
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true