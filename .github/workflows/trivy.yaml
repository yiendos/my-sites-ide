name: Docker image scan for Pull Requests
on:
  #this will trigger each time you push a commit, useful for debugging
  #push
  pull_request:
    types: [opened, assigned, review_requested]
jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      #PHP (fpm, cli) is a plugin now, scanned in its own repository - these are the images
      #still in core, built straight from their Dockerfiles (compose needs a root .env, which CI doesn't have)
      - name: Build mysql image
        run: docker build --progress quiet -t my_site_mysql _dev/environment/databases/mysql
      - name: Build mariadb image
        run: docker build --progress quiet -t my_site_mariadb _dev/environment/databases/mariadb
      - name: Build redis image
        run: docker build --progress quiet -t my_site_redis _dev/environment/caching/redis
      - name: Run trivy over mysql
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: 'my_site_mysql'
          format: 'table'
          exit-code: 0
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true
      - name: Run trivy over mariadb
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: 'my_site_mariadb'
          format: 'table'
          exit-code: 0
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true
      - name: Run trivy over redis
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: 'my_site_redis'
          format: 'table'
          exit-code: 0
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true
